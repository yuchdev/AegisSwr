[project]
name = "aegis-swr"
version = "1.0.0"
description = "Production forensics platform: multi-agent crash and incident analysis"
authors = [{ name = "Yurii Cherkasov", email = "yurii.cherkasov@gloriumtech.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.138.2",
    "uvicorn[standard]>=0.32,<0.33",
    "typer[all]>=0.26,<0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph==1.0.10",
    "anthropic>=0.40,<0.41",
    "openai>=1.55,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<0.31",
    "boto3>=1.35,<2",
    "qdrant-client>=1.12,<2",
    "loguru>=0.7,<0.8",
    "drain3>=0.9,<0.10",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.27,<0.28",
    "pyyaml>=6.0,<7",
    "bcrypt>=4.2,<5",
    "slowapi>=0.1,<0.2",
    "grpcio>=1.68.1,<2",
    "protobuf>=7.0,<8",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "pytesseract>=0.3,<0.4",
    "spacy>=3.8,<4",
    # spaCy model required by presidio-analyzer's SpacyNlpEngine. Pinned as a
    # direct-URL wheel so `uv sync` installs it explicitly; without it presidio
    # tries to auto-download via `python -m pip`, which fails in this pip-less
    # uv-managed venv (SystemExit). The 3.8.0 model release matches spacy>=3.8.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
aegis = "aegis_swr.cli.commands:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.9",
    # Pinned exact for byte-reproducible `uv run python scripts/proto_gen.py`
    # codegen across machines;
    # compiled against the same `<2` major series as the runtime grpcio
    # constraint (grpcio>=1.68.1,<2). Dev/test-only, never a runtime dep.
    "grpcio-tools==1.82.1",
    # TODO: update after upstream fix
    "pathspec!=1.1.1",
    "types-pyyaml>=6.0,<7",
    "types-boto3>=1.35,<2",
    "mypy-protobuf>=5.1.0",
    "types-protobuf>=7.34.1.20260816",
    "types-grpcio>=1.83.0.20260730",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the direct-URL spaCy model wheel (en-core-web-lg) in
# project.dependencies is accepted by hatchling at build time.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_swr"]

[tool.flake8_lint_tests]
# Selects which custom X-rules tests/flake8_lint/test_plugin_direct.py exercises.
# include/exclude: directories and files, first apply whitelist, then blacklist
# select/ignore: rules, first apply whitelist, then blacklist
# Leaving both empty (the default) tests every rule.
include = []
# client.py is exempted for the same reason as core/events.py: health check() is
# a resilience boundary (a readiness predicate the Task 03.0 lifecycle manager
# polls) that must never propagate, requiring a typed `except Exception` backstop.
# tool.py is exempted for the same reason: delegate() is a must-never-raise
# resilience boundary that must return a typed CodeResult for every failure
# (C9 - no exception escapes delegate()), requiring a defensive `except Exception`.
# cli/commands.py is exempted from X006 (local imports): it is the Typer CLI
# entrypoint and deliberately lazy-imports the heavy backend/orchestrator/
# OpenClaude object graph (anthropic/openai SDKs, boto3, langgraph, gRPC) inside
# each subcommand so `aegis --help` and quick commands do not pay the full
# backend import cost at startup. Moving those imports to the module scope would
# defeat that lazy-loading contract.
# config/settings.py is exempted from X006 for a genuine circular import: the
# `explicit` field validator needs `AgentSpec` from `aegis_swr.agents.base`,
# but that package imports `Settings` from this module, so a module-scope import
# forms a cycle. The import is deferred into the validator (documented at its
# call site), which only runs when non-default `explicit` data is supplied.
# grpc/proto/ holds generated protobuf/gRPC stubs (mirrors ruff.toml's
# extend-exclude for *_pb2.py / *_pb2_grpc.py and the coverage omitted): committed
# codegen, never hand-edited, so the X-rules do not gate it.
exclude = [
    "tests/flake8_lint/samples/",
    "src/aegis_swr/core/events.py",
    "src/aegis_swr/openclaude/grpc/client.py",
    "src/aegis_swr/openclaude/tool.py",
    "src/aegis_swr/cli/commands.py",
    "src/aegis_swr/config/settings.py",
    "src/aegis_swr/openclaude/grpc/proto/"
]

select = ["X001", "X002", "X004", "X005", "X006", "X007", "X008", "X009", "X010", "X011", "X012"]
ignore = ["X003"]

# When false, a `# noqa` comment never suppresses a violation (the rule
# engine's noqa support is bypassed entirely). Default true.
allow_noqa = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=src/aegis_swr --cov-report=html --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: OpenClaude live-process tests; skipped unless OPENCLAUDE_INTEGRATION is set and the openclaude binary is present",
]

[tool.coverage.run]
source = ["src/aegis_swr"]
branch = true
parallel = true
omit = [
    "*/site-packages/*",
    "*/distutils/*",
    # Generated gRPC stubs are committed code, not handwritten; exclude from
    # coverage (mirrors ruff's `extend-exclude` for `*_pb2.py`). Keeps the
    # scoped OpenClaude coverage gate honest rather than penalising codegen.
    "*/openclaude/grpc/proto/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
    "except ImportError",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85

[tool.coverage.html]
directory = ".htmlcov"
