[tool.poetry]
name = "aegis-swr"
version = "1.0.0"
description = "Production forensics platform: multi-agent crash and incident analysis"
authors = ["Yurii Cherkasov <yurii.cherkasov@gloriumtech.com>"]
packages = [{ include = "aegis_swr", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
typer = { version = "^0.26", extras = ["all"] }
pydantic = "^2.9"
pydantic-settings = "^2.5"
langgraph = "^0.2"
anthropic = "^0.40"
openai = "^1.55"
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
asyncpg = "^0.30"
boto3 = "^1.35"
qdrant-client = "^1.12"
loguru = "^0.7"
drain3 = "^0.9"
tiktoken = "^0.8"
httpx = "^0.27"
pyyaml = "^6.0"
bcrypt = "^4.2"
slowapi = "^0.1"
pytesseract = { version = "^0.3", optional = true }
easyocr = { version = "^1.7", optional = true }
spacy = { version = "^3.8", optional = true }
presidio-analyzer = { version = "^2.2", optional = true }
presidio-anonymizer = { version = "^2.2", optional = true }

[tool.poetry.extras]
ocr = ["pytesseract", "easyocr"]
pii = ["spacy", "presidio-analyzer", "presidio-anonymizer"]
all = ["pytesseract", "easyocr", "spacy", "presidio-analyzer", "presidio-anonymizer"]

[tool.poetry.scripts]
aegis = "aegis_swr.cli.commands:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"
types-pyyaml = "^6.0"
types-boto3 = "^1.35"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "drain3.*",
    "tiktoken",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "pytesseract",
    "PIL.*",
    "qdrant_client.*",
    "langgraph.*",
    "slowapi.*",
    "loguru",
    "anthropic",
    "openai",
    "pydantic_settings",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pydantic_settings has no bundled mypy stubs; BaseSettings resolves as Any,
# which triggers [misc] on every subclass. Disable that single error code for
# the settings module only.
module = ["aegis_swr.config.settings"]
disable_error_code = ["misc", "return-value"]
