[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-swr"
version = "1.0.0"
description = "Production forensics platform: multi-agent crash and incident analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yurii Cherkasov", email = "yurii.cherkasov@gloriumtech.com" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "typer>=0.26,<0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph>=0.2,<0.3",
    "anthropic>=0.40,<0.41",
    "openai>=1.55,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<0.31",
    "boto3>=1.35,<2",
    "qdrant-client>=1.12,<2",
    "loguru>=0.7,<0.8",
    "drain3>=0.9,<0.10",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.27,<0.28",
    "pyyaml>=6.0,<7",
    "bcrypt>=4.2,<5",
    "slowapi>=0.1,<0.2",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3,<0.4", "easyocr>=1.7,<2"]
pii = ["spacy>=3.8,<4", "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3"]
all = [
    "pytesseract>=0.3,<0.4",
    "easyocr>=1.7,<2",
    "spacy>=3.8,<4",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
]

[project.scripts]
aegis = "aegis_swr.cli.commands:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff==0.8.0",
    "mypy>=1.13,<2",
    "types-pyyaml>=6.0,<7",
    "types-boto3>=1.35,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_swr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "drain3.*",
    "tiktoken",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "pytesseract",
    "PIL.*",
    "qdrant_client.*",
    "langgraph.*",
    "slowapi.*",
    "loguru",
    "anthropic",
    "openai",
    "pydantic_settings",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pydantic_settings has no bundled mypy stubs; BaseSettings resolves as Any,
# which triggers [misc] on every subclass. Disable that single error code for
# the settings module only.
module = ["aegis_swr.config.settings"]
disable_error_code = ["misc", "return-value"]
