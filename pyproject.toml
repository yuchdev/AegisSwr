[project]
name = "aegis-swr"
version = "1.0.0"
description = "Production forensics platform: multi-agent crash and incident analysis"
authors = [{ name = "Yurii Cherkasov", email = "yurii.cherkasov@gloriumtech.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.138.2",
    "uvicorn[standard]>=0.32,<0.33",
    "typer[all]>=0.26,<0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "langgraph==1.0.10",
    "anthropic>=0.40,<0.41",
    "openai>=1.55,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<0.31",
    "boto3>=1.35,<2",
    "qdrant-client>=1.12,<2",
    "loguru>=0.7,<0.8",
    "drain3>=0.9,<0.10",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.27,<0.28",
    "pyyaml>=6.0,<7",
    "bcrypt>=4.2,<5",
    "slowapi>=0.1,<0.2",
    "grpcio>=1.68.1,<2",
    "protobuf>=7.0,<8",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "pytesseract>=0.3,<0.4",
    "spacy>=3.8,<4",
    # spaCy model required by presidio-analyzer's SpacyNlpEngine. Pinned as a
    # direct-URL wheel so `uv sync` installs it explicitly; without it presidio
    # tries to auto-download via `python -m pip`, which fails in this pip-less
    # uv-managed venv (SystemExit). The 3.8.0 model release matches spacy>=3.8.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
aegis = "aegis_swr.cli.commands:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.9",
    # Custom X-rule lint engine (ADR 0005). Supersedes the deleted in-tree
    # `src/flake8_project_rules/` prototype; see [tool.uv.sources] for the pin.
    "flake8-lint",
    # Pinned exact for byte-reproducible `uv run python scripts/proto_gen.py`
    # codegen across machines;
    # compiled against the same `<2` major series as the runtime grpcio
    # constraint (grpcio>=1.68.1,<2). Dev/test-only, never a runtime dep.
    "grpcio-tools==1.82.1",
    # TODO: update after upstream fix
    "pathspec!=1.1.1",
    "types-pyyaml>=6.0,<7",
    "types-boto3>=1.35,<2",
    "mypy-protobuf>=5.1.0",
    "types-protobuf>=7.34.1.20260816",
    "types-grpcio>=1.83.0.20260730",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required so the direct-URL spaCy model wheel (en-core-web-lg) in
# project.dependencies is accepted by hatchling at build time.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_swr"]

[tool.uv.sources]
# `flake8-lint` is not published to an index yet, so it is consumed from the
# sibling checkout. ADR 0005 requires a pinned reference rather than a floating
# one; switch this to `{ git = "https://github.com/yuchdev/Flake8Lint", rev = "<sha>" }`
# once the engine is pushed, because a relative path cannot resolve in CI.
flake8-lint = { path = "../Flake8Lint", editable = true }

[tool.flake8_lint]
# Governs both lint modes: the `flake8-lint check .` CLI gate and the
# `assert_lint_clean` pytest gate in tests/unit/test_project_lint.py.
# include/exclude: directories and files, first apply whitelist, then blacklist
# select/ignore: rules, first apply whitelist, then blacklist
# Leaving both empty (the default) runs every rule.
include = ["src", "tests", "scripts"]
exclude = [
    "src/aegis_swr/openclaude/grpc/client.py",
    "src/aegis_swr/openclaude/tool.py",
    "src/aegis_swr/openclaude/grpc/proto/",
    "src/aegis_swr/openhands/client.py",
    "src/aegis_swr/openhands/tool.py",
    "src/aegis_swr/claude_code/tool.py"
]

select = [
    "X001", "X002", "X003", "X004", "X005", "X006", "X007",
    "X008", "X009", "X010", "X011", "X012", "X013", "X014",
]
ignore = []

# When false, a `# noqa` comment never suppresses a violation (the rule
# engine's noqa support is bypassed entirely). Default true.
allow_noqa = true

# Whitelist: when non-empty, only files/directories listed here may use `# noqa`.
# When empty, all files not in `noqa_forbidden` are permitted.
noqa_allowed = [
    "src/aegis_swr/core/events.py"
]

# Blacklist: files/directories where `# noqa` is strictly forbidden (violations always fire).
# Blacklist always wins over `noqa_allowed`.
noqa_forbidden = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=src/aegis_swr --cov-report=html --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: OpenClaude live-process tests; skipped unless OPENCLAUDE_INTEGRATION is set and the openclaude binary is present",
]

[tool.coverage.run]
source = ["src/aegis_swr"]
branch = true
parallel = true
omit = [
    "*/site-packages/*",
    "*/distutils/*",
    # Generated gRPC stubs are committed code, not handwritten; exclude from
    # coverage (mirrors ruff's `extend-exclude` for `*_pb2.py`). Keeps the
    # scoped OpenClaude coverage gate honest rather than penalising codegen.
    "*/openclaude/grpc/proto/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
    "except ImportError",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85

[tool.coverage.html]
directory = ".htmlcov"
