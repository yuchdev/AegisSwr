[mypy]
python_version = 3.12
strict = true
plugins = pydantic.mypy
# enabled codes: redundant-cast,no-redef
disable_error_code = no-untyped-def,no-untyped-call,arg-type,type-arg,call-overload,override

# Neither library ships inline types or a `types-*` stub package on PyPI.
[mypy-pytesseract]
ignore_missing_imports = true

[mypy-drain3.*]
ignore_missing_imports = true

# mypy-protobuf emits `# type: ignore[misc, type-arg]` on the generated
# _ServicerContext; `type-arg` is globally disabled above, which makes that
# half of the comment "unused" under strict mode. Generated by
# `uv run python scripts/proto_gen.py` and not hand-maintained, so silence the
# resulting unused-ignore noise rather than editing codegen output.
[mypy-aegis_swr.openclaude.grpc.proto.openclaude_pb2_grpc]
warn_unused_ignores = false