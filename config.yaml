core:
  max_debate_rounds: 4
  consensus_threshold: 0.85
  hitl_confidence_threshold: 0.50
  log_window_seconds: 30
  user_assumption_token_limit: 500
  stack_frames_limit: 20

backends:
  ai:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_tokens: 4096
    stream: true

  debug:
    engine: "auto"
    timeout_seconds: 300
    callback_timeout_seconds: 60
    max_faulting_frames: 20
    max_other_thread_frames: 3
    symbol_cache: null
    symbol_server_url: null

  storage:
    provider: "filesystem"
    reports_dir: "~/.aegis-swr/reports"
    objects_dir: "~/.aegis-swr/objects"
    db_path: "~/.aegis-swr/reports.db"
    database_url: "postgresql+asyncpg://aegis:aegis@localhost:5432/aegis"
    object_store_url: "s3://aegis-raw-inputs"
    object_store_region: "us-east-1"
    s3_endpoint_url: null
    vector_store_url: "http://localhost:6333"
    vector_collection: "incident_history"

  log:
    provider: "file"                # file | fluent  (elk deferred)
    file_root: null                 # base dir for service→file resolution (file provider)
    default_severity_levels: ["FATAL", "CRITICAL", "ERROR", "WARNING"]
    elk_url: null                   # elk (deferred)
    fluent_host: null               # fluent stub
    fluent_port: null               # fluent stub
    fluent_tag_prefix: null         # fluent stub

  code:
    enabled: false                  # false → no CodeBackend; Stage 8 skipped
    provider: "git"                 # git | filesystem
    repo_path: null                 # working tree / source root
    window_hours: 2                 # default look-back for get_commits_before
    commit_limit: 10                # default max commits returned
    git_timeout_seconds: 30         # git subprocess timeout (git provider)

sandbox:
  enabled: true
  runtime: "docker"
  memory_mb: 256
  cpu_limit: 0.5
  timeout_seconds: 60

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  api_key_header: "X-Aegis-API-Key"
  rate_limit_per_minute: 10

agent_weights:
  memory_access_violation:
    os_kernel: 0.40
    code_analyst: 0.35
    log_historian: 0.15
    skeptic: 0.10
  null_pointer_dereference:
    os_kernel: 0.40
    code_analyst: 0.35
    log_historian: 0.15
    skeptic: 0.10
  use_after_free:
    os_kernel: 0.35
    code_analyst: 0.40
    log_historian: 0.15
    skeptic: 0.10
  stack_overflow:
    os_kernel: 0.45
    code_analyst: 0.30
    log_historian: 0.10
    skeptic: 0.15
  integer_divide_by_zero:
    os_kernel: 0.35
    code_analyst: 0.40
    log_historian: 0.10
    skeptic: 0.15
  deadlock:
    os_kernel: 0.35
    code_analyst: 0.30
    log_historian: 0.20
    skeptic: 0.15
  assertion_failure:
    os_kernel: 0.25
    code_analyst: 0.45
    log_historian: 0.15
    skeptic: 0.15
  resource_exhaustion:
    os_kernel: 0.35
    code_analyst: 0.25
    log_historian: 0.30
    skeptic: 0.10
  unhandled_exception:
    os_kernel: 0.30
    code_analyst: 0.35
    log_historian: 0.20
    skeptic: 0.15
  unknown:
    os_kernel: 0.30
    code_analyst: 0.35
    log_historian: 0.20
    skeptic: 0.15
