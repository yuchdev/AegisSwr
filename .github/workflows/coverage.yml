name: Test Coverage (85% Required)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-main-project:
    name: Main Project - Test & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=src/aegis_swr --cov-report=xml --cov-report=html --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-main
          path: .htmlcov/
          retention-days: 30

  test-prototype:
    name: Prototype - Test & Coverage
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prototype/requirements.txt

      - name: Run tests with coverage
        working-directory: prototype
        run: |
          pytest --cov=wincrash_analyzer --cov-report=xml --cov-report=html --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./prototype/coverage.xml
          flags: prototype
          name: codecov-prototype
          fail_ci_if_error: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-prototype
          path: prototype/.htmlcov/
          retention-days: 30

  coverage-summary:
    name: Coverage Check Summary
    runs-on: ubuntu-latest
    needs: [test-main-project, test-prototype]
    if: always()

    steps:
      - name: Check coverage status
        run: |
          if [ "${{ needs.test-main-project.result }}" = "failure" ] || [ "${{ needs.test-prototype.result }}" = "failure" ]; then
            echo "❌ Coverage requirements not met (85% minimum)"
            exit 1
          else
            echo "✅ All coverage requirements met"
          fi

