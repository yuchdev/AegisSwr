name: Test Coverage (85% Required)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-main-project:
    name: Main Project - Test & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=src/aegis_swr --cov-report=xml --cov-report=html --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-main
          path: htmlcov/
          retention-days: 30

  coverage-summary:
    name: Coverage Check Summary
    runs-on: ubuntu-latest
    needs: [test-main-project]
    if: always()

    steps:
      - name: Check coverage status
        run: |
          if [ "${{ needs.test-main-project.result }}" = "failure" ]; then
            echo "❌ Coverage requirements not met (85% minimum)"
            exit 1
          else
            echo "✅ All coverage requirements met"
          fi

