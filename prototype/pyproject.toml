[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wincrash-analyzer"
version = "1.0.0"
description = "AI-powered Windows crash dump analyzer – automates WinDbg forensics with LLM root-cause analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["windbg", "crash-dump", "debugging", "ai", "rca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "requests==2.31.0",
    "google-generativeai==0.3.2",
    "openai==2.24.0",
    "httpx<0.28.0",
    "rich==13.7.0",
    "PySide6==6.11.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wincrash-analyzer = "wincrash_analyzer.cli:main"
wincrash-analyzer-gui = "wincrash_analyzer.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wincrash_analyzer*"]
