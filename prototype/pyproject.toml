[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wincrash-analyzer"
version = "1.0.0"
description = "AI-powered Windows crash dump analyzer – automates WinDbg forensics with LLM root-cause analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["windbg", "crash-dump", "debugging", "ai", "rca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=wincrash_analyzer --cov-report=html --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["wincrash_analyzer"]
branch = true
parallel = true
omit = [
    "*/site-packages/*",
    "*/distutils/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
    "except ImportError",
    "except ImportError:",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"

[project.scripts]
wincrash-analyzer = "wincrash_analyzer.cli:main"
wincrash-analyzer-gui = "wincrash_analyzer.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wincrash_analyzer*"]
